<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Library Login Page</title>
    <link rel="stylesheet" href="liberarystyle.css">
</head>

<body>
    <div class="login-container">
        <h2 id="formTitle">Student Library Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="input-group">
                <label for="email">Library Email</label>
                <input type="email" id="email" placeholder="user@studentliberary.in" required>
                <small id="emailError" class="error-text"></small>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <form id="forgotPasswordForm" class="hidden">
            <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 1rem; margin-top: -0.5rem;">Enter your library email to receive a password reset link.</p>
            <div class="input-group">
                <label for="resetEmail">Library Email</label>
                <input type="email" id="resetEmail" placeholder="user@studentliberary.in" required>
                <small id="resetEmailError" class="error-text"></small>
            </div>

            <button type="submit" id="resetBtn">Send Reset Link</button>

            <div class="forgot-password" style="text-align: center; margin-top: 1rem;">
                <a href="#" id="backToLoginLink">Back to Login</a>
            </div>
        </form>

        <div id="messageBox" class="hidden"></div>
    </div>
    <script src="liberary.js"></script>
</body>

</html>
